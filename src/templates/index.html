<!DOCTYPE html>
<html>
<head>
    <title>LeaseLens</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #2c3e50; }
        .upload-box { border: 2px dashed #ccc; padding: 20px; text-align: center; margin: 20px 0; border-radius: 8px; }
        input[type=text] { width: 80%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .answer { background: #f8f9fa; padding: 15px; border-left: 4px solid #2c3e50; margin: 20px 0; border-radius: 4px; }
        .error { color: red; }
        .status { color: #27ae60; font-weight: bold; }
        #qa-section { display: none; }
    </style>
</head>
<body>
    <h1>LeaseLens</h1>
    <p>Upload your lease and ask anything about it in plain English.</p>
    <div class="upload-box">
        <p>Upload your lease (.pdf or .md)</p>
        <input type="file" id="lease-file" accept=".pdf,.md">
        <br><br>
        <button id="upload-btn">Upload Lease</button>
        <p id="upload-status"></p>
    </div>
    <div id="qa-section">
        <h2>Ask a question</h2>
        <input type="text" id="question" placeholder="e.g. When does my lease end?">
        <button id="ask-btn">Ask</button>
        <div id="answer"></div>
    </div>
    <script>
        var currentFile = null;

        document.getElementById('upload-btn').addEventListener('click', function() {
            var fileInput = document.getElementById('lease-file');
            if (!fileInput.files[0]) {
                alert('Please select a file first.');
                return;
            }
            currentFile = fileInput.files[0].name;
            var formData = new FormData();
            formData.append('file', fileInput.files[0]);
            document.getElementById('upload-status').textContent = 'Uploading...';
            fetch('/upload', { method: 'POST', body: formData })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.error) {
                        document.getElementById('upload-status').innerHTML = '<span class="error">' + data.error + '</span>';
                    } else {
                        document.getElementById('upload-status').innerHTML = '<span class="status">Loaded ' + data.pages + ' pages from ' + data.filename + '</span>';
                        document.getElementById('qa-section').style.display = 'block';
                    }
                });
        });

        document.getElementById('ask-btn').addEventListener('click', function() {
            var question = document.getElementById('question').value.trim();
            if (!question) return;
            document.getElementById('answer').innerHTML = '<p>Thinking...</p>';
            fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question, filename: currentFile })
            })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.error) {
                        document.getElementById('answer').innerHTML = '<p class="error">' + data.error + '</p>';
                    } else {
                        document.getElementById('answer').innerHTML = '<div class="answer">' + data.answer.replace(/\n/g, '<br>') + '</div>';
                    }
                });
        });

        document.getElementById('question').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('ask-btn').click();
        });
    </script>
</body>
</html>
